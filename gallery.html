<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galleria | Omat koirat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">Omat koirat</a>
      <button class="nav-toggle" aria-label="Avaa navigaatio" aria-expanded="false">&#9776;</button>
      <nav class="nav-links">
        <a href="index.html">Koti</a>
        <a href="gallery.html" class="active">Galleria</a>
        <a href="stories.html">Tarinat</a>
        <a href="journal.html">Päiväkirja</a>
        <a href="destinations.html">Paikat</a>
        <a href="contact.html">Ota yhteyttä</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Galleria</h1>
        <p>Kuvia Tepon, Sancion ja Nalan seikkailuista ympäri maata.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="gallery">
          <figure>
            <img src="Teppo.jpg" alt="Teppo">
            <figcaption>Teppo</figcaption>
          </figure>
          <figure>
            <img src="Sancho 3 v.jpg" alt="Sancho">
            <figcaption>Sancho</figcaption>
          </figure>
          <figure>
            <img src="Nala.jpeg" alt="Nala">
            <figcaption>Nala</figcaption>
          </figure>
          <figure>
            <img src="Teppo ja Sancho.jpg" alt="Teppo ja Sancho">
            <figcaption>Teppo & Sancho</figcaption>
          </figure>
          <figure>
            <img src="Sancho ja Teppo.jpg" alt="Sancho ja Teppo">
            <figcaption>Sancho & Teppo</figcaption>
          </figure>
          <figure>
            <img src="Koirat nauttii.HEIC" alt="Koirat nauttii">
            <figcaption>Koirat nauttii</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <div class="footer-title">Omat koirat</div>
        <span>Koirista kertominen passion.</span>
      </div>
      <div>
        <div class="footer-label">Tutustu</div>
        <div class="footer-links">
          <a href="gallery.html">Galleria</a>
          <a href="stories.html">Tarinat</a>
          <a href="journal.html">Päiväkirja</a>
        </div>
      </div>
      <div>
        <div class="footer-label">Lisää</div>
        <div class="footer-links">
          <a href="destinations.html">Paikat</a>
          <a href="contact.html">Ota yhteyttä</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const navToggle = document.querySelector('.nav-toggle');
    const navLinks = document.querySelector('.nav-links');

    if (navToggle && navLinks) {
      navToggle.addEventListener('click', function() {
        navLinks.classList.toggle('open');
        this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'false' ? 'true' : 'false');
      });
    }
  </script>
</body>
</html>
